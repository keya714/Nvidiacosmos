<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpamayo-R1-10B Video Model Tester</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .content {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        input[type="file"],
        textarea,
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="file"]:focus,
        textarea:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        .temperature-control {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .temperature-control input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 5px;
            background: #e0e0e0;
            outline: none;
        }

        .temperature-control input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        .temperature-control input[type="number"] {
            width: 80px;
            padding: 8px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }

        .result h3 {
            margin-bottom: 15px;
            color: #667eea;
        }

        .result-item {
            margin-bottom: 15px;
            padding: 12px;
            background: white;
            border-radius: 8px;
        }

        .result-label {
            font-weight: 600;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .result-value {
            color: #333;
            word-wrap: break-word;
        }

        .error {
            background: #fee;
            border-left-color: #f44336;
        }

        .error h3 {
            color: #f44336;
        }

        .video-preview {
            margin-top: 10px;
            max-width: 100%;
            border-radius: 10px;
            display: none;
        }

        .info-badge {
            display: inline-block;
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎥 Alpamayo-R1-10B Video Tester</h1>
            <p>Test NVIDIA's vision model with video input</p>
        </div>

        <div class="content">
            <form id="testForm">
                <div class="form-group">
                    <label for="videoFile">
                        Video File <span class="info-badge">.mp4, .avi, .mov</span>
                    </label>
                    <input type="file" id="videoFile" accept="video/*" required>
                    <video id="videoPreview" class="video-preview" controls></video>
                </div>

                <div class="form-group">
                    <label for="prompt">Prompt</label>
                    <textarea 
                        id="prompt" 
                        placeholder="Enter your prompt for the video (e.g., 'Describe what is happening in this video')"
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="temperature">
                        Temperature: <span id="tempValue">0.7</span>
                    </label>
                    <div class="temperature-control">
                        <input 
                            type="range" 
                            id="tempSlider" 
                            min="0" 
                            max="2" 
                            step="0.1" 
                            value="0.7"
                        >
                        <input 
                            type="number" 
                            id="temperature" 
                            min="0" 
                            max="2" 
                            step="0.1" 
                            value="0.7"
                        >
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    Process Video
                </button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing video... This may take a moment.</p>
            </div>

            <div class="result" id="result">
                <h3>✨ Model Response</h3>
                <div class="result-item">
                    <div class="result-label">Response:</div>
                    <div class="result-value" id="responseText"></div>
                </div>
                <div class="result-item">
                    <div class="result-label">Timestamp:</div>
                    <div class="result-value" id="timestamp"></div>
                </div>
                <div class="result-item">
                    <div class="result-label">Temperature:</div>
                    <div class="result-value" id="usedTemp"></div>
                </div>
                <div class="result-item">
                    <div class="result-label">Response Time:</div>
                    <div class="result-value" id="responseTime"></div>
                </div>
                <div class="result-item">
                    <div class="result-label">Saved to:</div>
                    <div class="result-value" id="csvFile"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('testForm');
        const videoFile = document.getElementById('videoFile');
        const videoPreview = document.getElementById('videoPreview');
        const promptInput = document.getElementById('prompt');
        const tempSlider = document.getElementById('tempSlider');
        const tempNumber = document.getElementById('temperature');
        const tempValue = document.getElementById('tempValue');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');

        // Video preview
        videoFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                videoPreview.src = url;
                videoPreview.style.display = 'block';
            }
        });

        // Sync temperature controls
        tempSlider.addEventListener('input', (e) => {
            const value = e.target.value;
            tempNumber.value = value;
            tempValue.textContent = value;
        });

        tempNumber.addEventListener('input', (e) => {
            const value = e.target.value;
            tempSlider.value = value;
            tempValue.textContent = value;
        });

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData();
            formData.append('video', videoFile.files[0]);
            formData.append('prompt', promptInput.value);
            formData.append('temperature', tempNumber.value);

            // Show loading
            submitBtn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';

            try {
                const response = await fetch('http://localhost:5000/process', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    // Show success result
                    result.classList.remove('error');
                    document.getElementById('responseText').textContent = data.response;
                    document.getElementById('timestamp').textContent = data.timestamp;
                    document.getElementById('usedTemp').textContent = data.temperature;
                    document.getElementById('responseTime').textContent = data.response_time;
                    document.getElementById('csvFile').textContent = data.csv_file;
                    result.style.display = 'block';
                } else {
                    // Show error
                    result.classList.add('error');
                    result.querySelector('h3').textContent = '❌ Error';
                    document.getElementById('responseText').textContent = data.error || 'Unknown error occurred';
                    result.style.display = 'block';
                }
            } catch (error) {
                // Show error
                result.classList.add('error');
                result.querySelector('h3').textContent = '❌ Error';
                document.getElementById('responseText').textContent = 'Failed to connect to server: ' + error.message;
                result.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
